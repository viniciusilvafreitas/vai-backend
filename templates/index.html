<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAI - Codex Architecture</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #161b22; padding: 12px 20px; border-bottom: 1px solid #30363d; font-size: 14px; font-weight: bold; color: #58a6ff; display: flex; justify-content: space-between; align-items: center; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 14px; border-radius: 6px; max-width: 85%; line-height: 1.5; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
        .user { background: #21262d; color: #f0f6fc; align-self: flex-end; border: 1px solid #30363d; }
        .assistant { background: #1f242c; color: #7ee787; align-self: flex-start; border: 1px solid #30363d; font-family: 'Courier New', Courier, monospace; }
        .input-area { padding: 12px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 10px; }
        input { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 10px; border-radius: 6px; font-family: inherit; outline: none; }
        input:focus { border-color: #58a6ff; }
        button { background: #238636; color: white; border: none; padding: 0 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #2ea043; }
        code { background: #161b22; padding: 2px 4px; border-radius: 4px; color: #ffa657; }
    </style>
</head>
<body>
    <header>
        <span>⚡ VAI // CODEX-CORE [ONLINE]</span>
        <span style="font-size: 11px; color: #8b949e;">Master Brain Active</span>
    </header>
    <div id="chat-container">
        <div class="message assistant">VAI Codex Engine inicializada. Ambiente seguro e autônomo pronto para comandos, Vinícius.</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Digite seu comando ou script..." autofocus>
        <button onclick="sendMessage()">Exec</button>
    </div>
    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, project: 'Geral' })
                });
                const data = await res.json();
                appendMessage(data.reply, 'assistant');
            } catch (err) {
                appendMessage('Erro crítico na execução do processo.', 'assistant');
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatContainer.appendChild(div);
        }
    </script>
</body>
</html>
